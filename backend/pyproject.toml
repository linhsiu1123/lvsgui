[project]
name = "lvs-qc-backend"
version = "0.1.0"
description = "LVS QC document-approval backend — FastAPI + MongoDB, behind Keycloak OIDC"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # PyMongo's own async client. Motor reached end-of-life in May 2026, so new
    # code uses pymongo.AsyncMongoClient rather than motor.motor_asyncio.
    "pymongo>=4.9",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
